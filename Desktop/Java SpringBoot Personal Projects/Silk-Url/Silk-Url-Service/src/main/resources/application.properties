spring.application.name=Silk-Url-Shortener

#Server port for LocalHost Server
server.port = 8000 
server.baseUrl = http://localhost:3000/

# For SpringBoot Forwaded Headers of Proxy Server
server.forward-headers-strategy=framework

#Configurations for DB Connections
spring.datasource.url = jdbc:postgresql://localhost:5432/silk_url
spring.datasource.username = username
spring.datasource.password = username_password

#For Hibernate SQL DDL Behaviour
spring.jpa.Hibernate.ddl-auto = update
spring.jpa.show-sql=true

#Configurations for Redis Server Connections
spring.data.redis.host = localhost
spring.data.redis.port = 6379
